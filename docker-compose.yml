# 本地开发依赖服务。
# MVP 使用 SQLite（文件型，无需容器），因此默认仅提供可选的 Redis。
# 不需要 Redis 时可忽略本文件，直接 `pnpm dev` 即可。

services:
  # 可选：仅在需要跨实例共享会话状态 / 横向扩展时启用。
  redis:
    image: redis:7-alpine
    container_name: oaw-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - redis
    volumes:
      - oaw-redis-data:/data

volumes:
  oaw-redis-data:
